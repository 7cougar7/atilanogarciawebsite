{% extends 'new_base.html' %}

{% block title %}Invalid Link{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h2 class="card-title">Invalid Link</h2>
                    <p>The link you used is invalid or has expired. Please try logging in again.</p>
                    <a href="{% url 'mainwebsite:login' %}" class="btn btn-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
