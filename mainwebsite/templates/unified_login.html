{% extends 'new_base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
{% if messages %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
<div data-react-component="UnifiedLogin"
     data-login-url="{% url 'mainwebsite:login' %}"
     data-auth-begin-url="{% url 'mainwebsite:custom_passkey_auth_begin' %}"
     data-auth-complete-url="{% url 'mainwebsite:custom_passkey_auth_complete' %}"
     data-next="{{ next }}">
</div>
{% endblock %}
